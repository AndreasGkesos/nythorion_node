services:
  postgres:
    image: postgres:16
    container_name: nythorion-node-postgres
    environment:
      POSTGRES_USER: nythorion
      POSTGRES_PASSWORD: nythorion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nythorion"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.2
    container_name: nythorion-node-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: nythorion
      MONGO_INITDB_ROOT_PASSWORD: nythorion
      MONGO_INITDB_DATABASE: nythorion_node
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
